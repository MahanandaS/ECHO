<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="description" content="Echo - Thoughts in motion. A contemplative blogging platform." />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Echo | Thoughts in Motion</title>
  </head>
  <body>
    <style>
      body {
        margin: 0;
        background: #1a3a2a;
        color: #e8e8e0;
        font-family: 'Lora', Georgia, serif;
      }

      .boot-fallback {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        text-align: center;
      }

      .boot-fallback strong {
        display: block;
        font-size: clamp(44px, 12vw, 96px);
        letter-spacing: -0.06em;
      }

      .boot-fallback span {
        display: block;
        margin-top: 14px;
        color: rgba(93, 75, 39, 0.62);
      }

      .boot-fallback p {
        max-width: 560px;
        margin: 18px auto 0;
        color: rgba(39, 28, 7, 0.62);
        line-height: 1.7;
      }

      .boot-fallback code {
        display: inline-block;
        margin-top: 18px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.06);
        padding: 12px 16px;
        color: #ffffff;
      }
    </style>
    <div id="root">
      <div class="boot-fallback">
        <div>
          <strong>Echo</strong>
          <span>Loading the writing room...</span>
          <p>
            If this message stays visible, the React app is not being served by Vite.
            Open a terminal in this folder and run:
          </p>
          <code>npm.cmd install &nbsp;&amp;&amp;&nbsp; npm.cmd run dev</code>
        </div>
      </div>
    </div>
    <noscript>Echo needs JavaScript enabled to run.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
